name: Terraform CI

on:
  # pull_request:
  #   branches: [main, master]
  #   paths:
  #     - "modules/**"
  #     - "environments/**"
  #     - "bootstrap/**"
  #     - ".github/workflows/**"
  # push:
  #   branches: [main, master]
  #   paths:
  #     - "modules/**"
  #     - "environments/**"
  #     - "bootstrap/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.7.5"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  fmt-validate:
    name: Fmt & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Init & validate each module
        run: |
          set -euo pipefail
          for dir in modules/*; do
            if [ -f "$dir/main.tf" ]; then
              echo "==> $dir"
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" validate
            fi
          done

  # Learning path: plan only "dev".
  # To extend later: change strategy.matrix.environment to [dev, qa, ...]
  # and create matching environments/<env>/ folders + state containers.
  plan:
    name: Plan (dev)
    needs: fmt-validate
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write backend.hcl from secrets
        env:
          TF_STATE_RG: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_SA: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          cat > backend.hcl <<EOF
          resource_group_name  = "${TF_STATE_RG}"
          storage_account_name = "${TF_STATE_SA}"
          container_name       = "tfstate-dev"
          key                  = "enterprise.tfstate"
          use_oidc             = true
          EOF

      - name: Terraform Init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -input=false -var-file=terraform.tfvars -out=tfplan \
            -var="aad_tenant_id=${{ secrets.AZURE_TENANT_ID }}"
          terraform show -no-color tfplan > plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev-${{ github.run_id }}
          path: |
            environments/dev/tfplan
            environments/dev/plan.txt
          retention-days: 7

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'environments/dev/plan.txt';
            let plan = '';
            try {
              plan = fs.readFileSync(path, 'utf8');
            } catch (e) {
              plan = `Plan file missing: ${e.message}`;
            }
            if (plan.length > 60000) {
              plan = plan.substring(0, 60000) + '\n...truncated...';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform Plan — \`dev\`\n\`\`\`\n${plan}\n\`\`\``
            });
