# Manual plan only — secrets / OIDC / GitHub Environments can be wired later.
name: Terraform CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan (or all)"
        required: true
        type: choice
        options:
          - all
          - dev
          - qa
          - prod

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.7.5"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  fmt-validate:
    name: Fmt & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Init & validate each module
        run: |
          set -euo pipefail
          for dir in modules/*; do
            if [ -f "$dir/main.tf" ]; then
              echo "==> $dir"
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" validate
            fi
          done

  plan:
    name: Plan (${{ matrix.environment }})
    needs: fmt-validate
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, prod]
    # Skip envs not selected when dispatching a single environment
    if: >
      inputs.environment == 'all' ||
      inputs.environment == matrix.environment
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write backend.hcl from secrets
        env:
          TF_STATE_RG: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_SA: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
          ENV_NAME: ${{ matrix.environment }}
        run: |
          cat > backend.hcl <<EOF
          resource_group_name  = "${TF_STATE_RG}"
          storage_account_name = "${TF_STATE_SA}"
          container_name       = "tfstate-${ENV_NAME}"
          key                  = "internetface.tfstate"
          use_oidc             = true
          EOF

      - name: Terraform Init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -input=false -var-file=terraform.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.run_id }}
          path: |
            environments/${{ matrix.environment }}/tfplan
            environments/${{ matrix.environment }}/plan.txt
          retention-days: 7
